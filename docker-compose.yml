version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintech_ai_chatbot
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://postgres:Vedantmallya%4047@db.vblsehbdclgoylwznmxa.supabase.co:5432/postgres}
      - ALLOWED_ORIGINS=*
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
